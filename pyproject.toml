[tool.poetry]
name = "oneup"
version = "0.10.2"
description = "A CLI tool to check for dependency updates for Python, in Python"
authors = ["Andrés Ignacio Torres <dev@aitorres.com>"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/aitorres/oneup"
keywords = [
    "python",
    "dependency updates",
    "pyproject",
    "requirements",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed"
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/aitorres/oneup/issues"

[tool.poetry.dependencies]
python = "^3.10"
termcolor = "^3.3.0"
requests = "^2.34.2"
requirements-parser = "^0.13.1"
toml = "^0.10.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.1"
black = "^26.10.1"
isort = "^9.0.2"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
flake8 = "^7.4.1"
mypy = "^2.4.0"
pylint = "^4.1.3"
types-toml = "^0.10.8.20260518"
types-requests = "^2.33.0.20261006"

[tool.isort]
src_paths = ["oneup", "tests"]
profile = "black"
line_length = 90

[tool.mypy]
warn_return_any = true
warn_unused_configs = true

[tool.pylint.FORMAT]
max-line-length=90

[tool.poetry.scripts]
oneup = 'oneup.cli:main'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
